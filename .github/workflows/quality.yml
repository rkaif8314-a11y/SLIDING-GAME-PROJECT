name: Game quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check game JavaScript syntax
        run: node --check script.js
      - name: Validate game HTML
        run: npx --yes html-validate index.html
      - name: Check repository whitespace
        run: git diff --check
